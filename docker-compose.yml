# Local Odoo 19 stack for developing and testing the pos_musqet addon.
#
# Throwaway by design — `docker compose down -v` removes the database and
# filestore so you can start clean. See docs/DEV.md for full usage.
#
# Quick start:
#   docker compose up -d                 # start Odoo at http://localhost:8069
#   docker compose run --rm odoo \
#     odoo -d test -i pos_musqet --test-enable --test-tags=/pos_musqet --stop-after-init

services:
  db:
    # Pinned by digest so every run gets the same build; see docs/DEV.md to update.
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0-20261015@sha256:27f920e002c43a1af7022a68f3cc17db71a2f9f3348800cb050721ce54893e49
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      # The odoo image reads these to reach Postgres.
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # Encrypts the Musqet API key / webhook secret at rest. Export it on the host
      # before `docker compose up` to save secrets in the UI; the test suite patches in
      # its own key and does not need it. See pos_musqet/docs/INSTALL.md §2.1.
      MUSQET_FIELD_ENCRYPTION_KEY: ${MUSQET_FIELD_ENCRYPTION_KEY:-}
    volumes:
      - odoo-data:/var/lib/odoo
      # Mount only the addon. /mnt/extra-addons is on the image's addons_path,
      # so pos_musqet is auto-discovered as a direct child.
      - ./pos_musqet:/mnt/extra-addons/pos_musqet

volumes:
  odoo-db:
  odoo-data:
